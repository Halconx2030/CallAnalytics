name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  calidad:
    name: Calidad (typecheck, lint, format, tests, build)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: telefono2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d telefono2_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Auditoría de seguridad (dependencias de producción)
        run: pnpm audit --prod --audit-level=high

      - name: Aplicar migraciones (base de pruebas)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/telefono2_test
        run: pnpm db:migrate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Tests con cobertura
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/telefono2_test
        run: pnpm test:coverage

      # El reporte se sube incluso si el paso anterior falla por el umbral:
      # el artefacto interesa justo cuando la cobertura no llega al mínimo.
      - name: Subir reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage/
          retention-days: 7

      - name: Build backend
        run: pnpm build

      - name: Typecheck SPA
        run: pnpm --dir presentation typecheck

      - name: Build SPA
        run: pnpm --dir presentation build

  docker-security:
    name: Seguridad de Imagen Docker (Trivy)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Construir imagen Docker
        run: docker build -t telefono-2:ci .

      - name: Escanear imagen con Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'telefono-2:ci'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: telefono2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d telefono2_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Instalar navegador de Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/telefono2_test
        run: pnpm test:e2e

      - name: Subir artefactos de fallos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
