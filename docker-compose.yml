services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: telefono2
    ports:
      - '5432:5432'
    volumes:
      - datos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d telefono2']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: postgresql://postgres:postgres@db:5432/telefono2
      DATABASE_SSL: 'false'
      LOG_LEVEL: info
      CORS_ORIGIN: http://localhost:5173
    ports:
      - '3000:3000'

volumes:
  datos-postgres:
